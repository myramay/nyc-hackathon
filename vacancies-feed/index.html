<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affordable Vacancies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0F1B2D; --ink-2:#16233A; --text:#EDEAE1; --text-dim:#9BA6B8; --border:#2B3A54;
    --accent:#C1440E; --go-bg:#122419; --go:#7fc99a; --lot-bg:#1A2440; --lot:#9db8ff; --warn:#ffcc66; --chip:#1E2C45;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --ink:#F4F1EA; --ink-2:#FFFFFF; --text:#20242E; --text-dim:#5B6270; --border:#DEDACF;
            --go-bg:#E7F2EA; --go:#2E6B45; --lot-bg:#E9EEFB; --lot:#2F4FA3; --warn:#8a5a00; --chip:#EFEBE1; }
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);display:flex;justify-content:center}
  .app{width:100%;max-width:820px;padding:28px 16px 64px}
  .eyebrow{color:var(--text-dim);font-size:13px;margin-bottom:6px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0 0 10px}
  .lede{color:var(--text-dim);font-size:15px;line-height:1.55;margin:0 0 18px}
  .card{background:var(--ink-2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
  .filters label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}
  .filters label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500;min-height:44px}
  input[type=number],select{font:inherit;font-size:15px;padding:9px;border-radius:7px;border:1px solid var(--border);background:var(--ink);color:var(--text);min-height:44px}
  input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
  .chip{background:var(--chip);border-radius:12px;padding:3px 10px;font-size:12.5px;display:inline-block}
  .chip.dl{background:transparent;border:1px solid var(--warn);color:var(--warn);font-weight:600}
  details.item{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px}
  details.item.lottery{background:var(--lot-bg);border-color:var(--lot)}
  details.item.listing{background:var(--go-bg);border-color:var(--go)}
  details.item summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px}
  details.item summary::-webkit-details-marker{display:none}
  details.item summary::after{content:"Details ▾";font-size:12.5px;color:var(--text-dim);font-weight:600}
  details.item[open] summary::after{content:"Hide details ▴"}
  .kind{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .lottery .kind{color:var(--lot)} .listing .kind{color:var(--go)}
  .title{font-size:16px;font-weight:650}
  .sub{font-size:13.5px;color:var(--text-dim)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .body{margin-top:10px;border-top:1px solid var(--border);padding-top:6px;font-size:14px;line-height:1.55}
  .body h4{font-size:12.5px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--text-dim);font-weight:600}
  .ok{color:var(--go);font-weight:600} .no{color:var(--warn);font-weight:600}
  a{color:inherit}
  .note{font-size:13px;color:var(--text-dim);line-height:1.5}
  .scroll{overflow-x:auto}
  .err{color:var(--warn)}
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">For caseworkers and voucher holders in NYC</div>
  <h1>Affordable vacancies</h1>
  <p class="lede">Open Housing Connect lotteries and voucher-friendly listings in one feed. Listings with discriminatory terms are left out.</p>

  <form class="card filters" id="filters">
    <label>Household size <input type="number" id="hh" min="1" max="12" inputmode="numeric" placeholder="any"></label>
    <label>Yearly income ($) <input type="number" id="income" min="0" step="1000" inputmode="numeric" placeholder="any"></label>
    <label>Bedrooms
      <select id="beds"><option value="">Any</option><option value="0">Studio</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
    </label>
    <label>Borough
      <select id="boro"><option value="">Any</option><option>Manhattan</option><option>Brooklyn</option><option>Bronx</option><option>Queens</option><option>Staten Island</option></select>
    </label>
    <label>Show
      <select id="kind"><option value="">Both</option><option value="lottery">Lotteries only</option><option value="listing">Listings only</option></select>
    </label>
    <label class="inline"><input type="checkbox" id="voucher" checked> Has a voucher (CityFHEPS / Section 8)</label>
    <label class="inline"><input type="checkbox" id="limit"> Rent within voucher limit only</label>
  </form>

  <div id="out" aria-live="polite"><div class="card note">Loading…</div></div>
</div>

<script>
const API = new URLSearchParams(location.search).get('api')
  || (location.protocol.startsWith('http') && location.pathname.startsWith('/vacancies-feed') ? location.origin : 'http://localhost:8000');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const usd = n => n == null ? '—' : '$' + Math.round(n).toLocaleString('en-US');
const bedLabel = b => b === 0 ? 'Studio' : b + 'BR';

function lotteryCard(i, hh){
  const offers = i.unit_offers.map(u => {
    const inc = hh ? u.income_by_household_size[String(hh)] : null;
    const incTxt = inc ? `${usd(inc[0])}–${usd(inc[1])}` : Object.keys(u.income_by_household_size).length ? 'varies by size' : '—';
    return `<tr><td>${u.count}× ${esc(u.layout)}</td><td>${usd(u.rent)}</td><td>${u.household_min ?? '?'}–${u.household_max ?? '?'}</td>
      <td>${incTxt}</td><td>${u.rent_within_voucher_limit == null ? '—' : u.rent_within_voucher_limit ? '<span class="ok">Yes</span>' : '<span class="no">No</span>'}</td></tr>`;
  }).join('');
  return `<details class="item lottery"><summary>
      <span class="kind">Housing Connect lottery</span>
      <span class="title">${esc(i.title)}</span>
      <span class="sub">${esc(i.address || '')}${i.borough ? ' · ' + esc(i.borough) : ''}${i.neighborhood ? ' · ' + esc(i.neighborhood) : ''}</span>
      <span class="tags">${i.deadline ? `<span class="chip dl">Apply by ${esc(i.deadline)}${i.days_left != null ? ` (${i.days_left} day${i.days_left === 1 ? '' : 's'})` : ''}</span>` : ''}
        ${i.bedrooms.map(b => `<span class="chip">${bedLabel(b)}</span>`).join('')}${i.units ? `<span class="chip">${i.units} units</span>` : ''}</span>
    </summary><div class="body">
      ${offers ? `<h4>Units${hh ? ` (income shown for a household of ${hh})` : ''}</h4><div class="scroll"><table><thead><tr><th>Unit</th><th>Rent</th><th>Household</th><th>Income</th><th>Voucher covers rent</th></tr></thead><tbody>${offers}</tbody></table></div>` : ''}
      ${i.income_tiers.length ? `<h4>Income tiers</h4><p>${esc(i.income_tiers.join(', '))}</p>` : ''}
      ${i.set_asides.length ? `<h4>Set-asides</h4><p>${esc(i.set_asides.join(', '))}</p>` : ''}
      <h4>If you have a voucher</h4><p>${esc(i.voucher_status)}</p>
      <h4>How to apply</h4><p>Apply online at <a href="${esc(i.url)}" target="_blank" rel="noopener">Housing Connect</a> before the deadline.${i.paper_application_address ? ` Paper applications: ${esc(i.paper_application_address)}.` : ''}</p>
      <p class="note">Source: ${esc(i.source)}</p>
    </div></details>`;
}

function listingCard(i){
  return `<details class="item listing"><summary>
      <span class="kind">Voucher-friendly listing</span>
      <span class="title">${esc(i.title)}</span>
      <span class="sub">${[i.address, i.borough].filter(Boolean).map(esc).join(' · ') || 'Location not stated'}</span>
      <span class="tags">${i.rent ? `<span class="chip">${usd(i.rent)}/mo</span>` : ''}${i.bedrooms.map(b => `<span class="chip">${bedLabel(b)}</span>`).join('')}
        ${i.within_voucher_limit ? '<span class="chip">Within voucher limit</span>' : ''}</span>
    </summary><div class="body">
      <h4>Why it's here</h4><p>${esc(i.voucher_status)}</p>
      ${i.url ? `<h4>Listing</h4><p><a href="${esc(i.url)}" target="_blank" rel="noopener">Open the original listing</a></p>` : ''}
      <p class="note">Source: ${esc(i.source)}. Checked by the discrimination detector; nothing discriminatory was found.</p>
    </div></details>`;
}

async function load(){
  const q = new URLSearchParams();
  const v = id => document.getElementById(id);
  if (v('hh').value) q.set('household_size', v('hh').value);
  if (v('income').value) q.set('income', v('income').value);
  if (v('beds').value) q.set('bedrooms', v('beds').value);
  if (v('boro').value) q.set('borough', v('boro').value);
  if (v('kind').value) q.set('kind', v('kind').value);
  q.set('has_voucher', v('voucher').checked);
  q.set('within_voucher_limit', v('limit').checked);
  const out = document.getElementById('out');
  try {
    const r = await fetch(API + '/vacancies?' + q);
    if (!r.ok) throw new Error(r.status);
    const f = await r.json();
    const hidden = f.hidden.discriminatory + f.hidden.needs_review;
    out.innerHTML = `<div class="stats"><span class="chip">${f.counts.lotteries} open lotteries</span><span class="chip">${f.counts.listings} voucher-friendly listings</span>
        ${hidden ? `<span class="chip">${hidden} listing${hidden === 1 ? '' : 's'} hidden (${f.hidden.discriminatory} discriminatory, ${f.hidden.needs_review} questionable)</span>` : ''}</div>
      ${f.items.map(i => i.kind === 'lottery' ? lotteryCard(i, v('hh').value) : listingCard(i)).join('') || '<div class="card note">Nothing matches these filters. Try removing one.</div>'}
      <div class="card note">${f.notes.map(esc).join('<br>')}<br>Lotteries updated ${esc(f.lotteries_as_of || '')}.</div>`;
  } catch (e) {
    out.innerHTML = '<div class="card err">Couldn\'t load the feed. Is the API running?</div>';
  }
}
document.getElementById('filters').addEventListener('input', () => { clearTimeout(window._t); window._t = setTimeout(load, 300); });
document.getElementById('filters').addEventListener('submit', e => { e.preventDefault(); load(); });
load();
</script>
</body>
</html>
