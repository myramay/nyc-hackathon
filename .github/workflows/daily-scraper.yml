
name: Daily Rental Scraper

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-rental-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          pip install -r scanner/python/requirements.txt
          bun install --frozen-lockfile

      - name: Run daily pipeline
        env:
          LISTING_FEED_URL: ${{ secrets.LISTING_FEED_URL }}
          LISTING_FEED_API_KEY: ${{ secrets.LISTING_FEED_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: voucher_detector
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run daily
